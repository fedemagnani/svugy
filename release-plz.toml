[workspace]
# publish only when a release PR merges, never on other pushes to main
release_always = false
# dist creates the one GitHub release per version, from the svugy-cli tag, once its installers are built
git_release_enable = false

# the published crates ship together on the workspace version
[[package]]
name = "svugy"
version_group = "svugy"

[[package]]
name = "svugy-cli"
version_group = "svugy"

[[package]]
name = "svugy-model"
version_group = "svugy"

[[package]]
name = "svugy-parse"
version_group = "svugy"

[[package]]
name = "svugy-dagre"
version_group = "svugy"

# built into the docs playground, never released
[[package]]
name = "svugy-wasm"
release = false

# the examples and their twin tests, never released
[[package]]
name = "svugy-examples"
release = false
