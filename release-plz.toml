[workspace]
# publish only when a release PR merges, never on other pushes to main
release_always = false

# the published crates ship together on the workspace version
[[package]]
name = "svugy"
version_group = "svugy"

[[package]]
name = "svugy-cli"
version_group = "svugy"

# published for `svugy` and `svugy-cli` to depend on, but only reached through them
[[package]]
name = "svugy-model"
version_group = "svugy"
git_release_enable = false

[[package]]
name = "svugy-parse"
version_group = "svugy"
git_release_enable = false

[[package]]
name = "svugy-dagre"
version_group = "svugy"
git_release_enable = false

# built into the docs playground, never released
[[package]]
name = "svugy-wasm"
release = false
