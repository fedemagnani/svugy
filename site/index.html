<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>svugy</title>
  <meta name="description"
    content="Write a diagram as a Markdown list; svugy renders it as one isometric SVG you can click into.">
  <link rel="stylesheet" href="playground.css">
  <link rel="stylesheet" href="site.css">
</head>

<body>
  <header class="bar">
    <a class="wordmark" href="./">svugy</a>
    <nav class="icon-links" aria-label="Links">
      <a class="icon-button" href="docs/" aria-label="Docs" title="Docs">
        <!-- Lucide book-open, ISC -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 7v14" />
          <path
            d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
        </svg>
      </a>
      <a class="icon-button" href="https://github.com/fedemagnani/svugy" aria-label="GitHub" title="GitHub">
        <!-- Octicons mark-github, MIT -->
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
        </svg>
      </a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>
        <span class="visually-hidden">Type cool diagrams in Markdown, Rust or d2</span>
        <span class="typed-title" aria-hidden="true" data-typed-prefix="Type cool diagrams in"
          data-typed-words="markdown rust d2">Type cool diagrams in markdown</span>
      </h1>

      <div class="install" data-tabs>
        <div class="segmented" role="tablist" aria-label="Install with">
          <button role="tab" aria-selected="true" aria-controls="install-unix" id="tab-unix">macOS / Linux</button>
          <button role="tab" aria-selected="false" aria-controls="install-windows" id="tab-windows"
            tabindex="-1">Windows</button>
          <button role="tab" aria-selected="false" aria-controls="install-cargo" id="tab-cargo"
            tabindex="-1">Cargo</button>
        </div>
        <div class="command" role="tabpanel" id="install-unix" aria-labelledby="tab-unix">
          <code>curl -fsSL https://svugy.dev/install.sh | sh</code>
          <button class="icon-button" type="button" data-copy-command aria-label="Copy command" title="Copy"></button>
        </div>
        <div class="command" role="tabpanel" id="install-windows" aria-labelledby="tab-windows" hidden>
          <code>irm https://svugy.dev/install.ps1 | iex</code>
          <button class="icon-button" type="button" data-copy-command aria-label="Copy command" title="Copy"></button>
        </div>
        <div class="command" role="tabpanel" id="install-cargo" aria-labelledby="tab-cargo" hidden>
          <code>cargo install svugy-cli</code>
          <button class="icon-button" type="button" data-copy-command aria-label="Copy command" title="Copy"></button>
        </div>
      </div>
      <p class="ask-agent">
        Or ask your agent:
        <button class="outline-button" type="button" data-copy-install-prompt disabled>Copy installation prompt</button>
      </p>
    </section>

    <section class="try" aria-label="Try it">
      <label class="picker">
        <span class="visually-hidden">Example</span>
        <select data-example-picker>
          <option value="webapp">Web app</option>
          <option value="cluster">Kubernetes cluster</option>
          <option value="events">Order events</option>
          <option value="release">Release pipeline</option>
        </select>
      </label>
      <div class="svugy-live" data-svugy-curtain>
        <textarea data-svugy-language="markdown" aria-label="Markdown source"></textarea>
        <object class="svugy" type="image/svg+xml" data="models/webapp.svg#svugy="
          aria-label="Rendered diagram"></object>
      </div>
    </section>
  </main>

  <!-- Lucide copy and check, ISC; site.js puts both into every copy button -->
  <template id="copy-icons">
    <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </svg>
    <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </template>

  <script src="site.js"></script>
</body>

</html>
