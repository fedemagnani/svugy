[workspace]
members = ["crates/*"]
exclude = ["vendor/dagre-dgl-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
svugy-model = { path = "crates/svugy-model" }
svugy-import = { path = "crates/svugy-import" }
svugy = { path = "crates/svugy" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = "7"
strsim = "0.11"
logos = "0.16"
chumsky = "0.12"
fontdb = { version = "0.23", default-features = false, features = ["std"] }
ttf-parser = "0.25"
dagre-dgl-rs = "=0.1.1"
taffy = "0.9"
kurbo = "0.11"
glam = { version = "0.30", features = ["libm"] }
libm = "0.2"
clap = { version = "4", features = ["derive"] }

resvg = { version = "0.45", default-features = false }
usvg = { version = "0.45", default-features = false }
roxmltree = "0.20"
insta = "1"

[patch.crates-io]
dagre-dgl-rs = { path = "vendor/dagre-dgl-rs" }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
