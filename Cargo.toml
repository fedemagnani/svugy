[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.2"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedemagnani/svugy"

[workspace.lints.clippy]
or_fun_call = "deny"
self_named_module_files = "deny"
unnecessary_lazy_evaluations = "allow"

[workspace.dependencies]
svugy-model = { path = "crates/svugy-model", version = "0.1.2" }
svugy-parse = { path = "crates/svugy-parse", version = "0.1.2" }
svugy = { path = "crates/svugy", version = "0.1.2" }
svugy-dagre = { path = "crates/svugy-dagre", version = "0.1.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = "7"
strsim = "0.11"
logos = "0.16"
chumsky = "0.12"
fontdb = { version = "0.23", default-features = false, features = ["std"] }
ttf-parser = "0.25"
taffy = "0.9"
kurbo = "0.11"
glam = { version = "0.30", features = ["libm"] }
libm = "0.2"
clap = { version = "4", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }

resvg = { version = "0.45", default-features = false }
usvg = { version = "0.45", default-features = false }
roxmltree = "0.20"
insta = "1"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
