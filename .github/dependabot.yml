version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # generated by dist: its actions are pinned through github-action-commits in dist-workspace.toml
    exclude-paths:
      - ".github/workflows/svugy-cli-release.yml"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
