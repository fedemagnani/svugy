name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No bare `_` patterns
        run: "! git grep -nE '\\|_\\||(^|[^a-zA-Z0-9_])_ =>|let _ =|[(,] ?_[,)]' -- 'crates/**/*.rs' 'examples/**/*.rs'"
      - name: Runtime syntax
        run: node --check crates/svugy/runtime/svugy.js
      - name: Test
        env:
          INSTA_UPDATE: new
        run: cargo test --workspace
      - name: The Rust web-app example renders examples/webapp/webapp.svg
        run: cargo run --quiet -p svugy-examples --example webapp | cmp - examples/webapp/webapp.svg
      - name: Upload pending pixel snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pending-pixel-snapshots
          path: crates/svugy/tests/snapshots/*.snap.new*
          if-no-files-found: ignore
      - name: Wasm check
        run: cargo check -p svugy-model -p svugy-parse -p svugy -p svugy-wasm --target wasm32-unknown-unknown

  d2-accepts-fixtures:
    runs-on: ubuntu-latest
    env:
      D2_VERSION: v0.9.0
      D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned d2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/d2.tar.gz" "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  $RUNNER_TEMP/d2.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          echo "$(dirname "$(find "$RUNNER_TEMP" -path '*/bin/d2' -type f | head -n 1)")" >> "$GITHUB_PATH"
      - name: Compile every valid d2 fixture with d2 itself
        run: |
          d2 --version
          git ls-files '*.d2' | grep -v 'syntax_error.d2$' | while read -r fixture; do
            d2 --layout=elk "$fixture" "$RUNNER_TEMP/out.svg"
          done

  # every target renders the committed README figure byte for byte, so it also fails when the figure is stale
  same-bytes-everywhere:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: wasm32-wasip1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'wasm32-wasip1'
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: v50.0.1
      - name: Render the README figure and diff it against the committed one
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
        run: cargo run --quiet --release -p svugy-cli --target ${{ matrix.target }} -- render examples/svugy/svugy.d2 --profile static --workflow main | diff - docs/svugy.svg
