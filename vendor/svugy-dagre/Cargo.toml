[package]
name = "svugy-dagre"
version.workspace = true
edition = "2021"
description = "dagre-dgl-rs with deterministic tie-breaking and per-graph dummy ids, as svugy's layered layout needs"
license = "MIT"
authors = ["Rochanglien Infimate"]
repository.workspace = true
readme = "VENDORED.md"
keywords = ["graph", "layout", "dagre", "diagram", "directed"]
categories = ["algorithms", "data-structures", "visualization"]

# keeps upstream's crate name, so its code and doctests merge in unchanged
[lib]
name = "dagre_dgl_rs"

# upstream code, linted upstream
[lints.rust]
unused = "allow"

[lints.clippy]
all = "allow"

[package.metadata.upstream]
dagre-dgl-rs = "0.1.1"

[dependencies]
indexmap = "2"
